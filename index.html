<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 탁구 기록기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; margin: 0; padding: 0 0 calc(5rem + env(safe-area-inset-bottom)); scrollbar-width: thin; scrollbar-color: rgba(148, 163, 184, 0.55) transparent; }
        .btn-press:active { transform: scale(0.95); transition: transform 0.1s; }
        /* 모바일 최적화: 얇고 은은한 스크롤바 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: rgba(148, 163, 184, 0.45); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(100, 116, 139, 0.6); }
    </style>
</head>
<body class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative">

    <div id="root"></div>

    <script type="text/babel">
        // -------------------------------------------------------------
        // 1. Firebase 초기화 및 연결 (고객님 설정 유지)
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyDjzeueCblNOUmNdETDEOhRAkhQC3Tflw8",
            authDomain: "my-pingpong.firebaseapp.com",
            databaseURL: "https://my-pingpong-default-rtdb.firebaseio.com/",
            projectId: "my-pingpong",
            storageBucket: "my-pingpong.firebasestorage.app",
            messagingSenderId: "512202176301",
            appId: "1:512202176301:web:70abc887e90d130f87c5a4"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const auth = firebase.auth();

        async function ensureSignedIn() {
            if (auth.currentUser) return auth.currentUser;
            const credential = await auth.signInAnonymously();
            return credential.user;
        }

        function getFirebaseErrorMessage(error) {
            if (error?.code === 'PERMISSION_DENIED' || error?.message?.includes('PERMISSION_DENIED')) {
                return '데이터베이스 권한이 없습니다. 관리자에게 Realtime Database 규칙 배포 여부를 확인해주세요.';
            }
            if (error?.code === 'auth/admin-restricted-operation' || error?.code === 'auth/operation-not-allowed') {
                return 'Firebase 익명 로그인이 꺼져 있습니다. Firebase Authentication에서 익명 로그인을 활성화해주세요.';
            }
            return error?.message || '잠시 후 다시 시도해주세요.';
        }


        const PLAYER_NAME_MAX_LENGTH = 30;
        const MATCH_DATE_PATTERN = /^\d{4}-\d{2}-\d{2}$/;
        const MATCH_SCORE_OPTIONS = [
            { scoreA: 3, scoreB: 0 },
            { scoreA: 3, scoreB: 1 },
            { scoreA: 3, scoreB: 2 },
            { scoreA: 0, scoreB: 3 },
            { scoreA: 1, scoreB: 3 },
            { scoreA: 2, scoreB: 3 }
        ];
        const MATCH_PAGE_SIZE = 50;

        const SPECIAL_DIVISION_RULE = {
            targetPlayerName: '민동인',
            opponentName: '박선행',
            minDivision: 1,
            maxDivision: 7
        };

        function parseDivisionNumber(division) {
            const match = String(division || '').match(/^(\d+)부$/);
            return match ? Number(match[1]) : null;
        }

        function formatDivision(number) {
            return `${number}부`;
        }

        function getDonginDivisionDelta(match) {
            if (!match || Number(match.scoreA) + Number(match.scoreB) !== 3) return 0;

            const isTargetA = match.playerA_name === SPECIAL_DIVISION_RULE.targetPlayerName;
            const isTargetB = match.playerB_name === SPECIAL_DIVISION_RULE.targetPlayerName;
            const isOpponentA = match.playerA_name === SPECIAL_DIVISION_RULE.opponentName;
            const isOpponentB = match.playerB_name === SPECIAL_DIVISION_RULE.opponentName;
            if (!((isTargetA && isOpponentB) || (isTargetB && isOpponentA))) return 0;

            const targetWon = isTargetA ? Number(match.scoreA) === 3 : Number(match.scoreB) === 3;
            return targetWon ? -1 : 1;
        }

        function getDonginMemberId(match) {
            if (match?.playerA_name === SPECIAL_DIVISION_RULE.targetPlayerName) return match.playerA_id;
            if (match?.playerB_name === SPECIAL_DIVISION_RULE.targetPlayerName) return match.playerB_id;
            return '';
        }

        function applyDivisionDelta(division, delta) {
            const currentDivisionNumber = parseDivisionNumber(division);
            if (!currentDivisionNumber || !delta) return { division, appliedDelta: 0 };

            const nextDivisionNumber = Math.min(
                SPECIAL_DIVISION_RULE.maxDivision,
                Math.max(SPECIAL_DIVISION_RULE.minDivision, currentDivisionNumber + delta)
            );

            return {
                division: formatDivision(nextDivisionNumber),
                appliedDelta: nextDivisionNumber - currentDivisionNumber
            };
        }

        function addSpecialDivisionUpdates(updates, members, previousMatch, nextMatch) {
            const previousDonginId = getDonginMemberId(previousMatch);
            const nextDonginId = getDonginMemberId(nextMatch);
            const donginId = nextDonginId || previousDonginId;
            if (!donginId) {
                if (nextMatch) nextMatch.donginDivisionDelta = 0;
                return '';
            }

            const donginMember = members.find(member => member.id === donginId);
            if (!donginMember?.division) {
                if (nextMatch) nextMatch.donginDivisionDelta = 0;
                return '';
            }

            let workingDivision = donginMember.division;
            const previousAppliedDelta = Number(previousMatch?.donginDivisionDelta) || 0;
            if (previousAppliedDelta) {
                workingDivision = applyDivisionDelta(workingDivision, -previousAppliedDelta).division;
            }

            let nextAppliedDelta = 0;
            if (nextMatch) {
                const result = applyDivisionDelta(workingDivision, getDonginDivisionDelta(nextMatch));
                workingDivision = result.division;
                nextAppliedDelta = result.appliedDelta;
                nextMatch.donginDivisionDelta = nextAppliedDelta;
            }

            if (workingDivision !== donginMember.division) {
                updates[`simple_members/${donginId}/division`] = workingDivision;
            }

            if (nextAppliedDelta < 0) return `${SPECIAL_DIVISION_RULE.targetPlayerName} 부수가 ${workingDivision}(으)로 올라갔습니다.`;
            if (nextAppliedDelta > 0) return `${SPECIAL_DIVISION_RULE.targetPlayerName} 부수가 ${workingDivision}(으)로 내려갔습니다.`;
            return '';
        }

        // 공통 Tailwind 클래스와 색상 역할 정의
        // primary=blue, opponent=red, success=emerald, neutral=gray
        const APP_CARD_CLASS = 'bg-white p-5 rounded-2xl shadow-sm border border-gray-100';
        const APP_CARD_COMPACT_CLASS = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100';
        const APP_CARD_TIGHT_CLASS = 'bg-white p-3 rounded-xl shadow-sm border border-gray-100';
        const EMPTY_STATE_CLASS = 'text-center text-sm font-bold text-gray-400 py-4 bg-gray-50 rounded-xl';
        const FORM_CONTROL_CLASS = 'w-full bg-gray-50 border-0 p-3 rounded-xl font-bold focus:ring-2 focus:ring-blue-500 outline-none';
        const DATE_INPUT_CLASS = 'w-full bg-white border border-gray-200 text-center font-bold text-gray-700 p-3 rounded-xl shadow-sm outline-none';
        const PRIMARY_BUTTON_CLASS = 'bg-blue-600 text-white font-black p-3 rounded-xl shadow-md btn-press disabled:bg-gray-400 disabled:cursor-not-allowed';
        const DANGER_BUTTON_CLASS = 'bg-red-50 text-red-600 btn-press disabled:opacity-50 disabled:cursor-not-allowed';
        const NEUTRAL_BUTTON_CLASS = 'bg-gray-900 text-white font-black p-3 rounded-xl shadow-md btn-press disabled:bg-gray-300 disabled:cursor-not-allowed';
        const PLAYER_A_CARD_CLASS = 'bg-blue-50 border-blue-100 text-blue-800';
        const PLAYER_A_CARD_ACTIVE_CLASS = 'bg-blue-600 border-blue-600 text-white shadow-md';
        const PLAYER_B_CARD_CLASS = 'bg-red-50 border-red-100 text-red-800';
        const PLAYER_B_CARD_ACTIVE_CLASS = 'bg-red-600 border-red-600 text-white shadow-md';
        const PLAYER_SELECT_BUTTON_CLASS = 'min-w-0 text-left p-3 rounded-xl border-2 shadow-sm btn-press transition';
        const SELECTED_BUTTON_CLASS = 'bg-gray-900 border-gray-900 text-white';
        const SUCCESS_SELECT_BUTTON_CLASS = 'bg-white border-emerald-100 text-gray-800 hover:bg-emerald-50';
        const SCORE_BUTTON_DISABLED_CLASS = 'disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white disabled:active:transform-none disabled:shadow-none';

        function sortMatchesByRecent(matchList) {
            return [...matchList].sort((a, b) => (Number(b.timestamp) || 0) - (Number(a.timestamp) || 0));
        }

        function formatMatchesSnapshot(snapshot) {
            const data = snapshot.val();
            return data ? sortMatchesByRecent(Object.keys(data).map(key => ({ id: key, ...data[key] }))) : [];
        }

        function makeH2hKey(playerAId, playerBId) {
            return [playerAId, playerBId].sort().join('_vs_');
        }

        function getMatchWinnerId(match) {
            return Number(match.scoreA) > Number(match.scoreB) ? match.playerA_id : match.playerB_id;
        }

        function addIncrement(updates, path, amount) {
            if (!amount) return;
            updates[path] = firebase.database.ServerValue.increment(amount);
        }

        function addMatchStatsUpdates(updates, match, direction) {
            if (!match?.playerA_id || !match?.playerB_id || !isAllowedMatchScore(Number(match.scoreA), Number(match.scoreB))) return;

            const winnerId = getMatchWinnerId(match);
            const players = [
                { id: match.playerA_id, opponentId: match.playerB_id, won: winnerId === match.playerA_id },
                { id: match.playerB_id, opponentId: match.playerA_id, won: winnerId === match.playerB_id }
            ];

            players.forEach(player => {
                addIncrement(updates, `stats_by_player/${player.id}/total`, direction);
                addIncrement(updates, `stats_by_player/${player.id}/${player.won ? 'wins' : 'losses'}`, direction);
                addIncrement(updates, `stats_by_player/${player.id}/opponents/${player.opponentId}/total`, direction);
                addIncrement(updates, `stats_by_player/${player.id}/opponents/${player.opponentId}/${player.won ? 'wins' : 'losses'}`, direction);
            });

            const [player1Id, player2Id] = [match.playerA_id, match.playerB_id].sort();
            const pairKey = makeH2hKey(match.playerA_id, match.playerB_id);
            updates[`h2h_stats/${pairKey}/player1_id`] = player1Id;
            updates[`h2h_stats/${pairKey}/player2_id`] = player2Id;
            addIncrement(updates, `h2h_stats/${pairKey}/total`, direction);
            addIncrement(updates, `h2h_stats/${pairKey}/${winnerId === player1Id ? 'player1_wins' : 'player2_wins'}`, direction);
        }

        function buildSaveMatchUpdates(matchId, match, members) {
            const updates = {};
            const divisionMessage = addSpecialDivisionUpdates(updates, members, null, match);
            updates[`simple_matches/${matchId}`] = match;
            addMatchStatsUpdates(updates, match, 1);
            return { updates, divisionMessage };
        }

        function buildReplaceMatchUpdates(matchId, previousMatch, nextMatch, members) {
            const updates = {};
            const divisionMessage = addSpecialDivisionUpdates(updates, members, previousMatch, nextMatch);
            updates[`simple_matches/${matchId}`] = nextMatch;
            if (previousMatch.statsVersion) addMatchStatsUpdates(updates, previousMatch, -1);
            addMatchStatsUpdates(updates, nextMatch, 1);
            return { updates, divisionMessage };
        }

        function buildDeleteMatchUpdates(matchId, match, members) {
            const updates = { [`simple_matches/${matchId}`]: null };
            addSpecialDivisionUpdates(updates, members, match, null);
            if (match.statsVersion) addMatchStatsUpdates(updates, match, -1);
            return updates;
        }

        function isAllowedMatchScore(scoreA, scoreB) {
            return MATCH_SCORE_OPTIONS.some(option => option.scoreA === scoreA && option.scoreB === scoreB);
        }

        function validateMatchPayload({ date, playerAId, playerAName, playerBId, playerBName, scoreA, scoreB }) {
            if (!MATCH_DATE_PATTERN.test(date || '')) return '경기 날짜는 YYYY-MM-DD 형식이어야 합니다.';
            if (!playerAId || !playerBId) return '두 선수를 모두 선택해주세요.';
            if (playerAId === playerBId) return '서로 다른 선수를 선택해주세요.';
            if (!isAllowedMatchScore(scoreA, scoreB)) return '허용된 세트 스코어(3:0, 3:1, 3:2, 0:3, 1:3, 2:3)만 저장할 수 있습니다.';
            if (typeof playerAName !== 'string' || playerAName.trim().length === 0 || playerAName.length > PLAYER_NAME_MAX_LENGTH) return `선수 A 이름은 1~${PLAYER_NAME_MAX_LENGTH}자여야 합니다.`;
            if (typeof playerBName !== 'string' || playerBName.trim().length === 0 || playerBName.length > PLAYER_NAME_MAX_LENGTH) return `선수 B 이름은 1~${PLAYER_NAME_MAX_LENGTH}자여야 합니다.`;
            return '';
        }

        // -------------------------------------------------------------
        // 2. React 메인 앱 컴포넌트
        // -------------------------------------------------------------
        const { useState, useEffect, useMemo, useRef } = React;

        function Toast({ toast, onDismiss }) {
            if (!toast) return null;

            const isSuccess = toast.type === 'success';
            const styles = isSuccess
                ? 'border-emerald-100 bg-emerald-50 text-emerald-800'
                : 'border-red-100 bg-red-50 text-red-800';
            const icon = isSuccess ? '✅' : '⚠️';

            return (
                <div className="fixed bottom-20 left-4 right-4 max-w-md mx-auto z-[60]">
                    <div className={`flex items-start gap-3 rounded-2xl border p-4 shadow-xl backdrop-blur ${styles}`} role="status" aria-live="polite">
                        <span className="text-lg leading-none">{icon}</span>
                        <p className="min-w-0 flex-1 whitespace-pre-line text-sm font-black leading-5">{toast.message}</p>
                        <button type="button" onClick={onDismiss} className="shrink-0 rounded-full px-2 text-lg font-black opacity-60 btn-press" aria-label="토스트 닫기">×</button>
                    </div>
                </div>
            );
        }

        function MemberDeleteConfirmModal({ member, isDeleting, onCancel, onDelete }) {
            if (!member) return null;

            return (
                <div className="fixed inset-0 z-[70] flex items-end justify-center bg-slate-900/50 px-4 pb-24 pt-8 sm:items-center sm:pb-8" role="dialog" aria-modal="true" aria-labelledby="delete-member-title">
                    <div className="w-full max-w-md rounded-3xl bg-white p-5 shadow-2xl">
                        <div className="mb-4">
                            <p className="text-xs font-black text-red-500">회원 삭제</p>
                            <h2 id="delete-member-title" className="mt-1 text-xl font-black text-gray-900">이 회원을 삭제할까요?</h2>
                            <p className="mt-1 text-sm font-bold text-gray-500">회원 목록에서만 삭제되며, 기존 경기 기록은 유지됩니다.</p>
                        </div>

                        <div className="rounded-2xl border border-gray-100 bg-gray-50 p-4">
                            <div className="flex items-center gap-3">
                                <span className="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-red-100 text-lg font-black text-red-700">{getMemberInitials(member)}</span>
                                <div className="min-w-0">
                                    <div className="truncate text-lg font-black text-gray-900">{member.name}</div>
                                    <div className="mt-1 inline-block rounded-full bg-white px-2 py-1 text-xs font-black text-gray-500">{member.division || '부수 미입력'}</div>
                                </div>
                            </div>
                        </div>

                        <div className="mt-5 grid grid-cols-2 gap-3">
                            <button type="button" onClick={onCancel} disabled={isDeleting} className="rounded-2xl bg-gray-100 p-3 font-black text-gray-700 btn-press disabled:opacity-50">취소</button>
                            <button type="button" onClick={() => onDelete(member)} disabled={isDeleting} className="rounded-2xl bg-red-600 p-3 font-black text-white shadow-md btn-press disabled:bg-gray-400">
                                {isDeleting ? '삭제 중...' : '삭제'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function DeleteConfirmModal({ match, members = [], isDeleting, onCancel, onDelete }) {
            if (!match) return null;

            const aWon = Number(match.scoreA) > Number(match.scoreB);
            const getMatchDivision = (playerId) => members.find(member => member.id === playerId)?.division || '부수 미입력';

            return (
                <div className="fixed inset-0 z-[70] flex items-end justify-center bg-slate-900/50 px-4 pb-24 pt-8 sm:items-center sm:pb-8" role="dialog" aria-modal="true" aria-labelledby="delete-match-title">
                    <div className="w-full max-w-md rounded-3xl bg-white p-5 shadow-2xl">
                        <div className="mb-4">
                            <p className="text-xs font-black text-red-500">경기 기록 삭제</p>
                            <h2 id="delete-match-title" className="mt-1 text-xl font-black text-gray-900">이 경기를 삭제할까요?</h2>
                            <p className="mt-1 text-sm font-bold text-gray-500">삭제한 기록은 되돌릴 수 없습니다.</p>
                        </div>

                        <div className="rounded-2xl border border-gray-100 bg-gray-50 p-4">
                            <div className="mb-3 text-center text-xs font-black text-gray-400">{match.date}</div>
                            <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-3">
                                <div className={`min-w-0 rounded-2xl bg-white p-3 text-center shadow-sm ${aWon ? 'ring-2 ring-blue-100' : ''}`}>
                                    <div className="text-[10px] font-black text-gray-400">선수 A</div>
                                    <div className={`truncate text-lg font-black ${aWon ? 'text-blue-600' : 'text-gray-700'}`}>{aWon ? '🏆 ' : ''}{match.playerA_name}</div>
                                    <div className="mt-1 inline-block max-w-full truncate rounded-full bg-gray-50 px-2 py-1 text-[10px] font-black text-gray-500">{getMatchDivision(match.playerA_id)}</div>
                                </div>
                                <div className="rounded-xl bg-gray-900 px-3 py-2 text-lg font-black tracking-widest text-white">{match.scoreA} : {match.scoreB}</div>
                                <div className={`min-w-0 rounded-2xl bg-white p-3 text-center shadow-sm ${!aWon ? 'ring-2 ring-red-100' : ''}`}>
                                    <div className="text-[10px] font-black text-gray-400">선수 B</div>
                                    <div className={`truncate text-lg font-black ${!aWon ? 'text-red-600' : 'text-gray-700'}`}>{!aWon ? '🏆 ' : ''}{match.playerB_name}</div>
                                    <div className="mt-1 inline-block max-w-full truncate rounded-full bg-gray-50 px-2 py-1 text-[10px] font-black text-gray-500">{getMatchDivision(match.playerB_id)}</div>
                                </div>
                            </div>
                        </div>

                        <div className="mt-5 grid grid-cols-2 gap-3">
                            <button type="button" onClick={onCancel} disabled={isDeleting} className="rounded-2xl bg-gray-100 p-3 font-black text-gray-700 btn-press disabled:opacity-50">취소</button>
                            <button type="button" onClick={() => onDelete(match)} disabled={isDeleting} className="rounded-2xl bg-red-600 p-3 font-black text-white shadow-md btn-press disabled:bg-gray-400">
                                {isDeleting ? '삭제 중...' : '삭제'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState('match');
            const [members, setMembers] = useState([]);
            const [matches, setMatches] = useState([]);
            const [statsByPlayer, setStatsByPlayer] = useState({});
            const [h2hStatsByPair, setH2hStatsByPair] = useState({});
            const [hasMoreMatches, setHasMoreMatches] = useState(false);
            const [isLoadingMoreMatches, setIsLoadingMoreMatches] = useState(false);
            const [isAuthReady, setIsAuthReady] = useState(false);
            const [authError, setAuthError] = useState('');
            const [toast, setToast] = useState(null);
            const toastTimerRef = useRef(null);
            const recentMatchIdsRef = useRef(new Set());

            const showToast = ({ type = 'success', message }) => {
                if (!message) return;
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                setToast({ type, message });
                toastTimerRef.current = setTimeout(() => setToast(null), 3500);
            };

            const dismissToast = () => {
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                setToast(null);
            };

            // Firebase 익명 로그인 후 실시간 데이터 구독
            useEffect(() => {
                let membersRef;
                let recentMatchesQuery;
                let statsByPlayerRef;
                let h2hStatsRef;

                ensureSignedIn()
                    .then(() => {
                        setIsAuthReady(true);
                        membersRef = db.ref('simple_members');
                        recentMatchesQuery = db.ref('simple_matches').orderByChild('timestamp').limitToLast(MATCH_PAGE_SIZE);
                        statsByPlayerRef = db.ref('stats_by_player');
                        h2hStatsRef = db.ref('h2h_stats');

                        membersRef.on('value', snapshot => {
                            const data = snapshot.val();
                            const formatted = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
                            setMembers(formatted);
                        }, error => {
                            console.error('회원 목록 불러오기 실패:', error);
                            setAuthError(getFirebaseErrorMessage(error));
                        });

                        recentMatchesQuery.on('value', snapshot => {
                            const recentMatches = formatMatchesSnapshot(snapshot);
                            const recentIds = new Set(recentMatches.map(match => match.id));
                            setMatches(current => {
                                const merged = new Map(
                                    current
                                        .filter(match => !recentMatchIdsRef.current.has(match.id) || recentIds.has(match.id))
                                        .map(match => [match.id, match])
                                );
                                recentMatches.forEach(match => merged.set(match.id, match));
                                return sortMatchesByRecent(Array.from(merged.values()));
                            });
                            recentMatchIdsRef.current = recentIds;
                            setHasMoreMatches(recentMatches.length === MATCH_PAGE_SIZE);
                        }, error => {
                            console.error('경기 기록 불러오기 실패:', error);
                            setAuthError(getFirebaseErrorMessage(error));
                        });

                        statsByPlayerRef.on('value', snapshot => {
                            setStatsByPlayer(snapshot.val() || {});
                        }, error => {
                            console.error('개인 통계 불러오기 실패:', error);
                            setAuthError(getFirebaseErrorMessage(error));
                        });

                        h2hStatsRef.on('value', snapshot => {
                            setH2hStatsByPair(snapshot.val() || {});
                        }, error => {
                            console.error('상대 전적 통계 불러오기 실패:', error);
                            setAuthError(getFirebaseErrorMessage(error));
                        });
                    })
                    .catch(error => {
                        console.error('Firebase 로그인 실패:', error);
                        setAuthError(getFirebaseErrorMessage(error));
                    });

                return () => {
                    if (membersRef) membersRef.off();
                    if (recentMatchesQuery) recentMatchesQuery.off();
                    if (statsByPlayerRef) statsByPlayerRef.off();
                    if (h2hStatsRef) h2hStatsRef.off();
                    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                };
            }, []);

            const updateLoadedMatch = (matchId, match) => {
                setMatches(current => sortMatchesByRecent(current.map(item => item.id === matchId ? { id: matchId, ...match } : item)));
            };

            const removeLoadedMatch = (matchId) => {
                setMatches(current => current.filter(match => match.id !== matchId));
            };

            const loadMoreMatches = async () => {
                if (!isAuthReady || isLoadingMoreMatches || matches.length === 0) return;

                setIsLoadingMoreMatches(true);
                try {
                    const oldestTimestamp = Math.min(...matches.map(match => Number(match.timestamp) || Date.now()));
                    const snapshot = await db.ref('simple_matches')
                        .orderByChild('timestamp')
                        .endAt(oldestTimestamp - 1)
                        .limitToLast(MATCH_PAGE_SIZE)
                        .once('value');
                    const olderMatches = formatMatchesSnapshot(snapshot);

                    setMatches(current => {
                        const merged = new Map(current.map(match => [match.id, match]));
                        olderMatches.forEach(match => merged.set(match.id, match));
                        return sortMatchesByRecent(Array.from(merged.values()));
                    });
                    setHasMoreMatches(olderMatches.length === MATCH_PAGE_SIZE);
                } catch (error) {
                    console.error('이전 경기 기록 불러오기 실패:', error);
                    showToast({ type: 'error', message: `이전 경기 기록을 불러오지 못했습니다.\n${getFirebaseErrorMessage(error)}` });
                } finally {
                    setIsLoadingMoreMatches(false);
                }
            };

            const tabContent = {
                member: { title: '회원 관리' },
                match: { title: '경기 기록' },
                stats: { title: '전적 통계' }
            };
            const currentTabContent = tabContent[activeTab];
            const navItems = [
                { id: 'member', icon: '👥', label: '회원' },
                { id: 'match', icon: '⚔️', label: '경기' },
                { id: 'stats', icon: '📊', label: '통계' }
            ];

            return (
                <div className="flex flex-col h-screen">
                    <header className="bg-blue-600 text-white px-4 py-5 text-center shadow-sm">
                        <div className="text-2xl font-black uppercase tracking-[0.18em] text-blue-100">🏓 탁구 기록기</div>
                        <h1 className="mt-2 text-2xl font-black">{currentTabContent.title}</h1>
                    </header>

                    <main className="flex-1 overflow-y-auto p-4">
                        {authError && (
                            <div className="mb-4 rounded-xl border border-red-100 bg-red-50 p-3 text-sm font-bold text-red-700">
                                {authError}
                            </div>
                        )}
                        {!isAuthReady && !authError && (
                            <div className="mb-4 rounded-xl border border-blue-100 bg-blue-50 p-3 text-sm font-bold text-blue-700">
                                Firebase에 연결하는 중입니다...
                            </div>
                        )}
                        {activeTab === 'member' && <MemberTab members={members} isAuthReady={isAuthReady} onToast={showToast} />}
                        {activeTab === 'match' && <MatchTab members={members} isAuthReady={isAuthReady} onToast={showToast} />}
                        {activeTab === 'stats' && (
                            <StatsTab
                                members={members}
                                matches={matches}
                                statsByPlayer={statsByPlayer}
                                h2hStatsByPair={h2hStatsByPair}
                                isAuthReady={isAuthReady}
                                hasMoreMatches={hasMoreMatches}
                                isLoadingMoreMatches={isLoadingMoreMatches}
                                onLoadMoreMatches={loadMoreMatches}
                                onMatchUpdated={updateLoadedMatch}
                                onMatchDeleted={removeLoadedMatch}
                                onToast={showToast}
                            />
                        )}
                    </main>

                    <Toast toast={toast} onDismiss={dismissToast} />

                    {/* 하단 네비게이션 */}
                    <nav aria-label="주요 메뉴" className="bg-white border-t flex justify-around gap-2 p-3 fixed bottom-0 w-full max-w-md text-sm font-bold text-gray-400 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        {navItems.map(item => {
                            const isActive = activeTab === item.id;

                            return (
                                <button
                                    key={item.id}
                                    type="button"
                                    aria-current={isActive ? 'page' : undefined}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`relative flex-1 flex flex-col items-center rounded-2xl px-2 py-2 btn-press transition-all duration-200 ${isActive ? 'bg-blue-50 text-blue-600 shadow-inner' : 'text-gray-400'}`}
                                >
                                    <span className={`absolute top-0 h-1 w-10 rounded-full bg-blue-600 transition-all duration-200 ${isActive ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-2'}`}></span>
                                    <span className={`mb-1 transition-all duration-200 ${isActive ? 'text-3xl scale-110' : 'text-xl scale-100'}`}>{item.icon}</span>
                                    <span className={isActive ? 'text-blue-700' : ''}>{item.label}</span>
                                </button>
                            );
                        })}
                    </nav>
                </div>
            );
        }


        function getMemberInitials(member) {
            const name = (member?.name || '').trim();
            if (!name) return '?';

            const nameParts = name.split(/\s+/).filter(Boolean);
            if (nameParts.length >= 2) {
                return nameParts.slice(0, 2).map(part => Array.from(part)[0]).join('').toUpperCase();
            }

            return Array.from(name)[0].toUpperCase();
        }

        function filterMembersByQuery(members, query) {
            const normalizedQuery = query.trim().toLowerCase();
            if (!normalizedQuery) return members;

            return members.filter(member => {
                const name = (member.name || '').toLowerCase();
                const division = (member.division || '').toLowerCase();
                return name.includes(normalizedQuery) || division.includes(normalizedQuery);
            });
        }

        function PlayerSearchList({
            members,
            selectedIds = [],
            onSelect,
            getTone = () => 'blue',
            getMetaLabel = member => member.division || '부수',
            searchPlaceholder = '이름 또는 부수로 검색',
            emptyMessage = '등록된 회원이 없습니다.',
            noResultsMessage = '검색 결과가 없습니다.'
        }) {
            const [searchQuery, setSearchQuery] = useState('');
            const filteredMembers = useMemo(() => filterMembersByQuery(members, searchQuery), [members, searchQuery]);

            const toneClasses = {
                blue: {
                    border: 'border-blue-100 hover:bg-blue-50',
                    badge: 'bg-blue-50 text-blue-700',
                    avatar: 'bg-blue-100 text-blue-700'
                },
                red: {
                    border: 'border-red-100 hover:bg-red-50',
                    badge: 'bg-red-50 text-red-700',
                    avatar: 'bg-red-100 text-red-700'
                },
                emerald: {
                    border: 'border-emerald-100 hover:bg-emerald-50',
                    badge: 'bg-emerald-50 text-emerald-700',
                    avatar: 'bg-emerald-100 text-emerald-700'
                }
            };

            return (
                <div className="space-y-3">
                    <label className="relative block">
                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">🔎</span>
                        <input
                            type="search"
                            value={searchQuery}
                            onChange={e => setSearchQuery(e.target.value)}
                            placeholder={searchPlaceholder}
                            className="w-full rounded-xl border border-gray-200 bg-gray-50 py-3 pl-9 pr-3 text-sm font-bold text-gray-700 outline-none focus:border-blue-300 focus:bg-white focus:ring-2 focus:ring-blue-100"
                        />
                    </label>

                    {members.length > 0 ? (
                        filteredMembers.length > 0 ? (
                            <div className="max-h-72 overflow-y-auto pr-1">
                                <div className="grid grid-cols-2 gap-2">
                                    {filteredMembers.map(member => {
                                        const selectedIndex = selectedIds.indexOf(member.id);
                                        const isSelected = selectedIndex > -1;
                                        const metaLabel = getMetaLabel(member, selectedIndex);
                                        const tone = toneClasses[getTone(member, selectedIndex)] || toneClasses.blue;

                                        return (
                                            <button
                                                key={member.id}
                                                type="button"
                                                onClick={() => onSelect(member.id)}
                                                className={`min-w-0 text-left p-3 rounded-xl border-2 shadow-sm btn-press transition ${isSelected ? 'bg-gray-900 border-gray-900 text-white' : `bg-white ${tone.border} text-gray-800`}`}
                                            >
                                                <div className="flex items-center gap-2 min-w-0">
                                                    <span className={`shrink-0 flex h-9 w-9 items-center justify-center rounded-full text-sm font-black ${isSelected ? 'bg-white/20 text-white' : tone.avatar}`}>
                                                        {getMemberInitials(member)}
                                                    </span>
                                                    <span className="min-w-0 flex-1">
                                                        <span className="block font-black text-base truncate">{member.name}</span>
                                                        <span className={`mt-1 inline-block max-w-full truncate text-[10px] font-black px-2 py-1 rounded-full ${isSelected ? 'bg-white/20 text-white' : tone.badge}`}>
                                                            {metaLabel}
                                                        </span>
                                                    </span>
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        ) : (
                            <div className="text-center text-sm font-bold text-gray-400 py-4 bg-gray-50 rounded-xl">{noResultsMessage}</div>
                        )
                    ) : (
                        <div className="text-center text-sm font-bold text-gray-400 py-4 bg-gray-50 rounded-xl">{emptyMessage}</div>
                    )}
                </div>
            );
        }

        function PlayerCardSelector({ members, selectedA, selectedB, activeSlot, onActiveSlotChange, onSelect, labels = { a: '선수 A', b: '선수 B' }, showSlotLabels = true }) {
            const getName = (id, fallback) => members.find(m => m.id === id)?.name || fallback;

            return (
                <div className={`${APP_CARD_COMPACT_CLASS} space-y-4`}>
                    <div className="grid grid-cols-[1fr_auto_1fr] gap-2 items-center">
                        <button
                            type="button"
                            onClick={() => onActiveSlotChange('A')}
                            className={`min-w-0 p-3 rounded-xl text-center border-2 btn-press ${activeSlot === 'A' ? PLAYER_A_CARD_ACTIVE_CLASS : PLAYER_A_CARD_CLASS}`}
                        >
                            {showSlotLabels && <div className="text-[10px] font-black opacity-70 mb-1">{labels.a}</div>}
                            <div className="font-black text-lg truncate">{getName(selectedA, '선택')}</div>
                        </button>
                        <span className="font-black text-gray-300 italic text-xl">VS</span>
                        <button
                            type="button"
                            onClick={() => onActiveSlotChange('B')}
                            className={`min-w-0 p-3 rounded-xl text-center border-2 btn-press ${activeSlot === 'B' ? PLAYER_B_CARD_ACTIVE_CLASS : PLAYER_B_CARD_CLASS}`}
                        >
                            {showSlotLabels && <div className="text-[10px] font-black opacity-70 mb-1">{labels.b}</div>}
                            <div className="font-black text-lg truncate">{getName(selectedB, '선택')}</div>
                        </button>
                    </div>

                    <div>
                        <p className="text-xs font-bold text-gray-400 mb-2 text-center">
                            {showSlotLabels
                                ? (activeSlot === 'A' ? `${labels.a}를 선택하세요. 선택 후 바로 ${labels.b}를 고를 수 있습니다.` : `${labels.b}를 선택하세요.`)
                                : (activeSlot === 'A' ? '첫 번째 선수를 선택하세요. 선택 후 바로 두 번째 선수를 고를 수 있습니다.' : '두 번째 선수를 선택하세요.')}
                        </p>
                        {members.length > 0 ? (
                            <div className="grid grid-cols-2 gap-2">
                                {members.map(member => {
                                    const isSelectedA = selectedA === member.id;
                                    const isSelectedB = selectedB === member.id;
                                    const isSelected = isSelectedA || isSelectedB;
                                    return (
                                        <button
                                            key={member.id}
                                            type="button"
                                            onClick={() => onSelect(member.id)}
                                            className={`${PLAYER_SELECT_BUTTON_CLASS} ${isSelected ? SELECTED_BUTTON_CLASS : activeSlot === 'A' ? 'bg-white border-blue-100 text-gray-800 hover:bg-blue-50' : 'bg-white border-red-100 text-gray-800 hover:bg-red-50'}`}
                                        >
                                            <div className="flex items-center justify-between gap-2">
                                                <span className="font-black text-base truncate">{member.name}</span>
                                                <span className={`shrink-0 text-[10px] font-black px-2 py-1 rounded-full ${isSelected ? 'bg-white/20 text-white' : 'bg-gray-100 text-gray-500'}`}>
                                                    {isSelectedA ? labels.a : isSelectedB ? labels.b : member.division || '부수'}
                                                </span>

                                        </button>
