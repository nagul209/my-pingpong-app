        // -------------------------------------------------------------
        // 3. 회원 관리 탭 컴포넌트
        // -------------------------------------------------------------
        function MemberTab({ members, isAuthReady, onToast }) {
            const DIVISION_OPTIONS = ['1부', '2부', '3부', '4부', '5부', '6부', '7부'];
            const [name, setName] = useState('');
            const [division, setDivision] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const [editingMemberId, setEditingMemberId] = useState('');
            const [editName, setEditName] = useState('');
            const [editDivision, setEditDivision] = useState('');
            const [savingMemberId, setSavingMemberId] = useState('');
            const [pendingDeleteMember, setPendingDeleteMember] = useState(null);

            const validateMemberForm = (memberName, memberDivision) => {
                const trimmedName = memberName.trim();
                if (!isAuthReady) return 'Firebase 연결이 완료된 후 다시 시도해주세요.';
                if (!trimmedName) return '이름을 입력해주세요.';
                if (trimmedName.length > PLAYER_NAME_MAX_LENGTH) return `이름은 ${PLAYER_NAME_MAX_LENGTH}자 이하로 입력해주세요.`;
                if (!memberDivision) return '부수를 선택해주세요.';
                if (!DIVISION_OPTIONS.includes(memberDivision)) return '올바른 부수를 선택해주세요.';
                return '';
            };

            const addMember = async () => {
                const trimmedName = name.trim();
                const validationMessage = validateMemberForm(name, division);
                if (validationMessage) return onToast({ type: 'error', message: validationMessage });

                setIsSaving(true);

                try {
                    const newMember = {
                        name: trimmedName,
                        division,
                        joinedAt: Date.now()
                    };
                    if (auth.currentUser?.uid) newMember.createdBy = auth.currentUser.uid;

                    await db.ref('simple_members').push(newMember);
                    setName('');
                    setDivision('');
                    onToast({ type: 'success', message: '회원이 추가되었습니다.' });
                } catch (error) {
                    console.error('회원 저장 실패:', error);
                    onToast({ type: 'error', message: `회원 저장에 실패했습니다.
${getFirebaseErrorMessage(error)}` });
                } finally {
                    setIsSaving(false);
                }
            };

            const startEditMember = (member) => {
                setEditingMemberId(member.id);
                setEditName(member.name || '');
                setEditDivision(member.division || '');
            };

            const cancelEditMember = () => {
                setEditingMemberId('');
                setEditName('');
                setEditDivision('');
                setSavingMemberId('');
            };

            const updateMember = async (member) => {
                const trimmedName = editName.trim();
                const validationMessage = validateMemberForm(editName, editDivision);
                if (validationMessage) return onToast({ type: 'error', message: validationMessage });

                setSavingMemberId(member.id);

                try {
                    const updatedMember = {
                        name: trimmedName,
                        division: editDivision,
                        joinedAt: member.joinedAt || Date.now(),
                        updatedAt: Date.now()
                    };
                    if (member.createdBy) updatedMember.createdBy = member.createdBy;
                    if (auth.currentUser?.uid) updatedMember.updatedBy = auth.currentUser.uid;

                    await db.ref(`simple_members/${member.id}`).set(updatedMember);
                    cancelEditMember();
                    onToast({ type: 'success', message: '회원 정보가 수정되었습니다.' });
                } catch (error) {
                    console.error('회원 수정 실패:', error);
                    onToast({ type: 'error', message: `회원 수정에 실패했습니다.
${getFirebaseErrorMessage(error)}` });
                } finally {
                    setSavingMemberId('');
                }
            };

            const requestDeleteMember = (member) => {
                if (!isAuthReady) return onToast({ type: 'error', message: 'Firebase 연결이 완료된 후 다시 시도해주세요.' });
                setPendingDeleteMember(member);
            };

            const deleteMember = async (member) => {
                setSavingMemberId(member.id);

                try {
                    await db.ref(`simple_members/${member.id}`).remove();
                    if (editingMemberId === member.id) cancelEditMember();
                    setPendingDeleteMember(null);
                    onToast({ type: 'success', message: '회원이 삭제되었습니다.' });
                } catch (error) {
                    console.error('회원 삭제 실패:', error);
                    onToast({ type: 'error', message: `회원 삭제에 실패했습니다.
${getFirebaseErrorMessage(error)}` });
                } finally {
                    setSavingMemberId('');
                }
            };

            return (
                <>
                    <MemberDeleteConfirmModal
                        member={pendingDeleteMember}
                        isDeleting={Boolean(pendingDeleteMember && savingMemberId === pendingDeleteMember.id)}
                        onCancel={() => setPendingDeleteMember(null)}
                        onDelete={deleteMember}
                    />
                    <div className="space-y-6">
                    <div className={APP_CARD_CLASS}>
                        <h2 className="font-extrabold text-gray-800 mb-4 text-lg">➕ 새 회원 등록</h2>
                        <div className="space-y-3">
                            <input type="text" value={name} onChange={e => setName(e.target.value)} maxLength={PLAYER_NAME_MAX_LENGTH} placeholder="이름" className={FORM_CONTROL_CLASS} />
                            <select value={division} onChange={e => setDivision(e.target.value)} className={FORM_CONTROL_CLASS}>
                                <option value="" disabled>부수를 선택하세요</option>
                                {DIVISION_OPTIONS.map(option => <option key={option} value={option}>{option}</option>)}
                            </select>
                            <button onClick={addMember} disabled={isSaving || !isAuthReady} className={`w-full ${PRIMARY_BUTTON_CLASS} ${isSaving || !isAuthReady ? '' : 'disabled:bg-gray-400'}`}>
                                {isSaving ? '저장 중...' : isAuthReady ? '등록하기' : '연결 중...'}
                            </button>
                        </div>
                    </div>

                    <div>
                        <h2 className="font-extrabold text-gray-800 mb-3 text-lg px-1">📋 회원 목록 ({members.length}명)</h2>
                        {members.length > 0 ? (
                            <ul className="space-y-2">
                                {members.map(m => {
                                    const isEditing = editingMemberId === m.id;
                                    const isSavingMember = savingMemberId === m.id;

                                    return (
                                        <li key={m.id} className={`${APP_CARD_COMPACT_CLASS} space-y-3`}>
                                            <div className="flex items-center justify-between gap-3">
                                                <div className="min-w-0 flex items-center gap-3">
                                                    <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-blue-100 text-sm font-black text-blue-700">{getMemberInitials(m)}</span>
                                                    <div className="min-w-0">
                                                        <span className="block truncate font-bold text-gray-800 text-lg">{m.name}</span>
                                                        <span className="mt-1 inline-block text-xs font-medium text-blue-600 bg-blue-50 px-2 py-1 rounded-md">
                                                            {m.division || '부수 미입력'}
                                                        </span>
                                                    </div>
                                                </div>
                                                <div className="flex shrink-0 gap-2">
                                                    <button
                                                        type="button"
                                                        onClick={() => isEditing ? cancelEditMember() : startEditMember(m)}
                                                        disabled={isSavingMember}
                                                        className={`text-[11px] font-black px-3 py-1 rounded-full btn-press ${isEditing ? 'bg-gray-200 text-gray-700' : 'bg-blue-50 text-blue-700'}`}
                                                    >
                                                        {isEditing ? '취소' : '수정'}
                                                    </button>
                                                    <button
                                                        type="button"
                                                        onClick={() => requestDeleteMember(m)}
                                                        disabled={isSavingMember}
                                                        className={`text-[11px] font-black px-3 py-1 rounded-full ${DANGER_BUTTON_CLASS}`}
                                                    >
                                                        삭제
                                                    </button>
                                                </div>
                                            </div>

                                            {isEditing ? (
                                                <div className="rounded-2xl border border-gray-100 bg-gray-50 p-3 space-y-3">
                                                    <input type="text" value={editName} onChange={e => setEditName(e.target.value)} maxLength={PLAYER_NAME_MAX_LENGTH} placeholder="이름" className="w-full bg-white border border-gray-200 p-3 rounded-xl font-bold outline-none focus:ring-2 focus:ring-blue-500" />
                                                    <select value={editDivision} onChange={e => setEditDivision(e.target.value)} className="w-full bg-white border border-gray-200 p-3 rounded-xl font-bold outline-none focus:ring-2 focus:ring-blue-500">
                                                        <option value="" disabled>부수를 선택하세요</option>
                                                        {DIVISION_OPTIONS.map(option => <option key={option} value={option}>{option}</option>)}
                                                    </select>
                                                    <button
                                                        type="button"
                                                        onClick={() => updateMember(m)}
                                                        disabled={isSavingMember || !isAuthReady}
                                                        className={`w-full ${PRIMARY_BUTTON_CLASS}`}
                                                    >
                                                        {isSavingMember ? '저장 중...' : '수정 저장'}
                                                    </button>
                                                </div>
                                            ) : null}
                                        </li>
                                    );
                                })}
                            </ul>
                        ) : (
                            <div className={EMPTY_STATE_CLASS}>등록된 회원이 없습니다.</div>
                        )}
                    </div>
                    </div>
                </>
            );
        }

        // -------------------------------------------------------------
        // 4. 경기 기록 탭 컴포넌트 (원터치 최적화)
        // -------------------------------------------------------------
        function MatchTab({ members, isAuthReady, onToast }) {
            const today = new Date().toISOString().split('T')[0];
            const [date, setDate] = useState(today);
            const [playerA, setPlayerA] = useState('');
            const [playerB, setPlayerB] = useState('');
            const [activePlayerSlot, setActivePlayerSlot] = useState('A');
            const [isSavingMatch, setIsSavingMatch] = useState(false);
            const isSavingMatchRef = useRef(false);
            const recentSavedMatchRef = useRef({ key: '', savedAt: 0 });
            const duplicateGuardMs = 3000;
            const isScoreSelectionReady = Boolean(playerA && playerB);
            const getSelectedPlayerName = (memberId, fallback) => members.find(member => member.id === memberId)?.name || fallback;
            const scoreButtons = MATCH_SCORE_OPTIONS.map(option => {
                const isPlayerAWinner = option.scoreA > option.scoreB;

                return {
                    ...option,
                    color: isPlayerAWinner ? 'blue' : 'red',
                    winnerName: isPlayerAWinner
                        ? getSelectedPlayerName(playerA, '선수 A')
                        : getSelectedPlayerName(playerB, '선수 B')
                };
            });

            const selectMatchPlayer = (memberId) => {
                if (activePlayerSlot === 'A') {
                    setPlayerA(memberId);
                    if (memberId === playerB) setPlayerB('');
                    setActivePlayerSlot('B');
                    return;
                }

                if (memberId === playerA) {
                    onToast({ type: 'error', message: '서로 다른 선수를 선택해주세요.' });
                    return;
                }

                setPlayerB(memberId);
            };

            const saveMatch = async (scoreA, scoreB) => {
                if (isSavingMatch || isSavingMatchRef.current) return;
                if (!isAuthReady) return onToast({ type: 'error', message: 'Firebase 연결이 완료된 후 다시 시도해주세요.' });

                const nameA = members.find(m => m.id === playerA)?.name;
                const nameB = members.find(m => m.id === playerB)?.name;
                const validationMessage = validateMatchPayload({
                    date,
                    playerAId: playerA,
                    playerAName: nameA,
                    playerBId: playerB,
                    playerBName: nameB,
                    scoreA,
                    scoreB
                });
                if (validationMessage) return onToast({ type: 'error', message: validationMessage });

                const matchKey = [date, playerA, playerB, scoreA, scoreB].join('|');
                const now = Date.now();
                if (recentSavedMatchRef.current.key === matchKey && now - recentSavedMatchRef.current.savedAt < duplicateGuardMs) {
                    return onToast({ type: 'error', message: '방금 저장한 동일 경기입니다. 잠시 후 다시 시도해주세요.' });
                }

                setIsSavingMatch(true);
                isSavingMatchRef.current = true;

                try {
                    const newMatch = {
                        date,
                        playerA_id: playerA, playerA_name: nameA,
                        playerB_id: playerB, playerB_name: nameB,
                        scoreA, scoreB,
                        timestamp: Date.now(),
                        statsVersion: 1
                    };
                    if (auth.currentUser?.uid) newMatch.createdBy = auth.currentUser.uid;

                    const matchRef = db.ref('simple_matches').push();
                    const { updates, divisionMessage } = buildSaveMatchUpdates(matchRef.key, newMatch, members);
                    await db.ref().update(updates);

                    recentSavedMatchRef.current = { key: matchKey, savedAt: Date.now() };
                    onToast({ type: 'success', message: `${nameA} ${scoreA} : ${scoreB} ${nameB}
기록이 저장되었습니다!${divisionMessage ? `
${divisionMessage}` : ''}` });
                } catch (error) {
                    console.error('경기 저장 실패:', error);
                    onToast({ type: 'error', message: `경기 저장에 실패했습니다.\n${getFirebaseErrorMessage(error)}` });
                } finally {
                    isSavingMatchRef.current = false;
                    setIsSavingMatch(false);
                }
                // 초기화 (다음 경기를 위해 선수는 유지하고 스코어만 리셋하는 개념이므로 알림만 띄움)
            };

            return (
                <div className="flex flex-col gap-5 h-full">
                    {/* 날짜 */}
                    <input type="date" value={date} onChange={e => setDate(e.target.value)} className={DATE_INPUT_CLASS} />

                    {/* 선수 선택 */}
                    <PlayerCardSelector
                        members={members}
                        selectedA={playerA}
                        selectedB={playerB}
                        activeSlot={activePlayerSlot}
                        onActiveSlotChange={setActivePlayerSlot}
                        onSelect={selectMatchPlayer}
                        showSlotLabels={false}
                    />

                    {/* 원터치 스코어 보드 */}
                    <div className="mt-4">
                        <p className="text-center text-xs font-bold text-gray-400 mb-3">👇 경기 결과를 터치하면 즉시 저장됩니다</p>
                        <div className="grid grid-cols-2 gap-3">
                            {scoreButtons.map(({ scoreA, scoreB, color, winnerName }) => {
                                const colorClass = color === 'blue'
                                    ? 'bg-blue-600 border-blue-600 text-white shadow-md hover:bg-blue-700'
                                    : 'bg-red-600 border-red-600 text-white shadow-md hover:bg-red-700';
                                const disabledColorClass = color === 'blue'
                                    ? 'disabled:bg-blue-50 disabled:border-blue-100 disabled:text-blue-300'
                                    : 'disabled:bg-red-50 disabled:border-red-100 disabled:text-red-300';

                                return (
                                    <button
                                        key={`${scoreA}-${scoreB}`}
                                        onClick={() => saveMatch(scoreA, scoreB)}
                                        disabled={isSavingMatch || !isAuthReady}
                                        className={`bg-white border-2 ${colorClass} ${disabledColorClass} flex min-h-[8.75rem] flex-col items-center justify-center gap-2 px-3 py-5 text-center font-black rounded-2xl shadow-sm btn-press ${SCORE_BUTTON_DISABLED_CLASS}`}
                                    >
                                        <span className="min-h-[1.5rem] max-w-full truncate text-lg font-black leading-snug">
                                            {isScoreSelectionReady ? `${winnerName} 승리` : '선수를 먼저 선택하세요'}
                                        </span>
                                        <span className="text-4xl font-black leading-none tracking-tight">{scoreA}:{scoreB}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // -------------------------------------------------------------
        // 5. 통계 탭 컴포넌트
        // -------------------------------------------------------------
        function StatsTab({ members, matches, statsByPlayer, h2hStatsByPair, isAuthReady, hasMoreMatches, isLoadingMoreMatches, onLoadMoreMatches, onMatchUpdated, onMatchDeleted, onToast }) {
            const [personalPlayer, setPersonalPlayer] = useState('');
            const [statA, setStatA] = useState('');
            const [statB, setStatB] = useState('');
            const [activeStatSlot, setActiveStatSlot] = useState('A');
            const [editingMatchId, setEditingMatchId] = useState('');
            const [editDate, setEditDate] = useState('');
            const [editPlayerA, setEditPlayerA] = useState('');
            const [editPlayerB, setEditPlayerB] = useState('');
            const [editScoreA, setEditScoreA] = useState(3);
            const [editScoreB, setEditScoreB] = useState(0);
            const [savingMatchId, setSavingMatchId] = useState('');
            const [pendingDeleteMatch, setPendingDeleteMatch] = useState(null);

            const getPlayerName = (playerId) => members.find(member => member.id === playerId)?.name || '선수';
            const getPlayerDivision = (playerId) => members.find(member => member.id === playerId)?.division || '부수 미입력';

            const getOpponentInfo = (opponentId, fallbackName) => {
                const member = members.find(item => item.id === opponentId);
                return {
                    id: opponentId,
                    name: member?.name || fallbackName || '알 수 없음',
                    division: member?.division || '부수 미입력'
                };
            };

            const SCORE_OPTIONS = MATCH_SCORE_OPTIONS;

            const getMemberName = (memberId, fallbackName) => members.find(member => member.id === memberId)?.name || fallbackName || '선수';

            const getPlayerOptions = (currentId, currentName) => {
                const hasCurrentMember = members.some(member => member.id === currentId);
                return hasCurrentMember || !currentId
                    ? members
                    : [{ id: currentId, name: currentName || '삭제된 회원', division: '기존 기록' }, ...members];
            };

            const startEditMatch = (match) => {
                setEditingMatchId(match.id);
                setEditDate(match.date || new Date().toISOString().split('T')[0]);
                setEditPlayerA(match.playerA_id || '');
                setEditPlayerB(match.playerB_id || '');
                setEditScoreA(Number(match.scoreA));
                setEditScoreB(Number(match.scoreB));
            };

            const cancelEditMatch = () => {
                setEditingMatchId('');
                setSavingMatchId('');
            };

            const updateMatch = async (match) => {
                if (!isAuthReady) return onToast({ type: 'error', message: 'Firebase 연결이 완료된 후 다시 시도해주세요.' });

                const nameA = getMemberName(editPlayerA, match.playerA_id === editPlayerA ? match.playerA_name : '선수 A');
                const nameB = getMemberName(editPlayerB, match.playerB_id === editPlayerB ? match.playerB_name : '선수 B');
                const validationMessage = validateMatchPayload({
                    date: editDate,
                    playerAId: editPlayerA,
                    playerAName: nameA,
                    playerBId: editPlayerB,
                    playerBName: nameB,
                    scoreA: editScoreA,
                    scoreB: editScoreB
                });
                if (validationMessage) return onToast({ type: 'error', message: validationMessage });

                setSavingMatchId(match.id);

                try {
                    const updatedMatch = {
                        date: editDate,
                        playerA_id: editPlayerA,
                        playerA_name: nameA,
                        playerB_id: editPlayerB,
                        playerB_name: nameB,
                        scoreA: editScoreA,
                        scoreB: editScoreB,
                        timestamp: match.timestamp || Date.now(),
                        updatedAt: Date.now(),
                        statsVersion: 1
                    };
                    if (match.createdBy) updatedMatch.createdBy = match.createdBy;
                    if (auth.currentUser?.uid) updatedMatch.updatedBy = auth.currentUser.uid;

                    const { updates, divisionMessage } = buildReplaceMatchUpdates(match.id, match, updatedMatch, members);
                    await db.ref().update(updates);
                    onMatchUpdated(match.id, updatedMatch);
                    cancelEditMatch();
                    onToast({ type: 'success', message: `경기 기록이 수정되었습니다.${divisionMessage ? `
${divisionMessage}` : ''}` });
                } catch (error) {
                    console.error('경기 수정 실패:', error);
                    onToast({ type: 'error', message: `경기 수정에 실패했습니다.\n${getFirebaseErrorMessage(error)}` });
                } finally {
                    setSavingMatchId('');
                }
            };

            const requestDeleteMatch = (match) => {
                if (!isAuthReady) return onToast({ type: 'error', message: 'Firebase 연결이 완료된 후 다시 시도해주세요.' });
                setPendingDeleteMatch(match);
            };

            const deleteMatch = async (match) => {
                if (!isAuthReady) return onToast({ type: 'error', message: 'Firebase 연결이 완료된 후 다시 시도해주세요.' });

                setSavingMatchId(match.id);

                try {
                    await db.ref().update(buildDeleteMatchUpdates(match.id, match, members));
                    onMatchDeleted(match.id);
                    if (editingMatchId === match.id) cancelEditMatch();
                    setPendingDeleteMatch(null);
                    onToast({ type: 'success', message: '경기 기록이 삭제되었습니다.' });
                } catch (error) {
                    console.error('경기 삭제 실패:', error);
                    onToast({ type: 'error', message: `경기 삭제에 실패했습니다.\n${getFirebaseErrorMessage(error)}` });
                } finally {
                    setSavingMatchId('');
                }
            };

            const selectStatPlayer = (memberId) => {
                if (activeStatSlot === 'A') {
                    setStatA(memberId);
                    if (memberId === statB) setStatB('');
                    setActiveStatSlot('B');
                    return;
                }

                if (memberId === statA) {
                    onToast({ type: 'error', message: '서로 다른 선수를 선택해주세요.' });
                    return;
                }

                setStatB(memberId);
            };

            // 개인 전적 계산: 쓰기 시점에 누적된 stats_by_player 집계 노드를 사용
            const personalStats = useMemo(() => {
                if (!personalPlayer) return null;

                const playerStats = statsByPlayer?.[personalPlayer] || {};
                const opponents = Object.entries(playerStats.opponents || {})
                    .map(([opponentId, opponentStats]) => ({
                        ...getOpponentInfo(opponentId),
                        total: Number(opponentStats.total) || 0,
                        wins: Number(opponentStats.wins) || 0,
                        losses: Number(opponentStats.losses) || 0
                    }))
                    .filter(opponent => opponent.total > 0)
                    .map(opponent => ({
                        ...opponent,
                        winRate: opponent.total ? Math.round((opponent.wins / opponent.total) * 100) : 0
                    }))
                    .sort((a, b) => b.total - a.total || b.wins - a.wins || a.name.localeCompare(b.name, 'ko'));

                const total = Number(playerStats.total) || 0;
                const wins = Number(playerStats.wins) || 0;
                const losses = Number(playerStats.losses) || 0;

                return {
                    total,
                    wins,
                    losses,
                    winRate: total ? Math.round((wins / total) * 100) : 0,
                    opponents
                };
            }, [personalPlayer, statsByPlayer, members]);

            // 상대 전적에 해당하는 경기만 추려 최신순으로 표시
            const h2hMatches = useMemo(() => {
                if (!statA || !statB) return [];
                return matches.filter(m =>
                    (m.playerA_id === statA && m.playerB_id === statB) ||
                    (m.playerA_id === statB && m.playerB_id === statA)
                );
            }, [statA, statB, matches]);

            // 상대 전적 계산: h2h_stats 집계 노드를 우선 사용
            const h2hStats = useMemo(() => {
                if (!statA || !statB) return null;

                const pairStats = h2hStatsByPair?.[makeH2hKey(statA, statB)];
                if (!pairStats) return { aWins: 0, bWins: 0, total: 0 };

                const player1Wins = Number(pairStats.player1_wins) || 0;
                const player2Wins = Number(pairStats.player2_wins) || 0;
                const aWins = pairStats.player1_id === statA ? player1Wins : player2Wins;
                const bWins = pairStats.player1_id === statB ? player1Wins : player2Wins;

                return { aWins, bWins, total: Number(pairStats.total) || aWins + bWins };
            }, [statA, statB, h2hStatsByPair]);

            return (
                <>
                    <DeleteConfirmModal
                        match={pendingDeleteMatch}
                        members={members}
                        isDeleting={Boolean(pendingDeleteMatch && savingMatchId === pendingDeleteMatch.id)}
                        onCancel={() => setPendingDeleteMatch(null)}
                        onDelete={deleteMatch}
                    />
                    <div className="space-y-6">
                    {/* 개인 전적 검색 */}
                    <div className={APP_CARD_CLASS}>
                        <h2 className="font-extrabold text-gray-800 mb-2 text-lg">👤 개인 전적 기록</h2>
                        <p className="text-xs font-bold text-gray-400 mb-3">선수를 선택하면 전체 승률과 상대별 전적을 볼 수 있습니다.</p>

                        {members.length > 0 ? (
                            <div className="grid grid-cols-2 gap-2 mb-4">
                                {members.map(member => {
                                    const isSelected = personalPlayer === member.id;
                                    return (
                                        <button
                                            key={member.id}
                                            type="button"
                                            onClick={() => setPersonalPlayer(member.id)}
                                            className={`${PLAYER_SELECT_BUTTON_CLASS} ${isSelected ? 'bg-emerald-600 border-emerald-600 text-white' : SUCCESS_SELECT_BUTTON_CLASS}`}
                                        >
                                            <div className="flex items-center justify-between gap-2">
                                                <span className="font-black text-base truncate">{member.name}</span>
                                                <span className={`shrink-0 text-[10px] font-black px-2 py-1 rounded-full ${isSelected ? 'bg-white/20 text-white' : 'bg-emerald-50 text-emerald-700'}`}>
                                                    {member.division || '부수'}
                                                </span>
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        ) : (
                            <div className={EMPTY_STATE_CLASS}>등록된 회원이 없습니다.</div>
                        )}

                        {personalPlayer && personalStats ? (
                            <div className="space-y-4">
                                <div className="bg-emerald-600 text-white p-4 rounded-xl">
                                    <div className="text-sm font-bold text-emerald-100 mb-3">{getPlayerName(personalPlayer)} 개인 통계</div>
                                    <div className="grid grid-cols-4 gap-2 text-center">
                                        <div>
                                            <div className="text-2xl font-black">{personalStats.total}</div>
                                            <div className="text-[10px] font-bold text-emerald-100">경기</div>
                                        </div>
                                        <div>
                                            <div className="text-2xl font-black">{personalStats.wins}</div>
                                            <div className="text-[10px] font-bold text-emerald-100">승</div>
                                        </div>
                                        <div>
                                            <div className="text-2xl font-black">{personalStats.losses}</div>
                                            <div className="text-[10px] font-bold text-emerald-100">패</div>
                                        </div>
                                        <div>
                                            <div className="text-2xl font-black">{personalStats.winRate}%</div>
                                            <div className="text-[10px] font-bold text-emerald-100">승률</div>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-extrabold text-gray-700 mb-2 text-sm">상대별 기록</h3>
                                    {personalStats.opponents.length > 0 ? (
                                        <ul className="space-y-2">
                                            {personalStats.opponents.map(opponent => (
                                                <li key={opponent.id} className="bg-gray-50 p-3 rounded-xl border border-gray-100">
                                                    <div className="flex items-center justify-between gap-2 mb-2">
                                                        <div className="min-w-0">
                                                            <div className="font-black text-gray-800 truncate">vs {opponent.name}</div>
                                                            <div className="text-[10px] font-bold text-gray-400">{opponent.division}</div>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className="font-black text-emerald-600">{opponent.wins}승 {opponent.losses}패</div>
                                                            <div className="text-[10px] font-bold text-gray-400">총 {opponent.total}전 · 승률 {opponent.winRate}%</div>
                                                        </div>
                                                    </div>
                                                    <div className="h-2 bg-white rounded-full overflow-hidden">
                                                        <div className="h-full bg-emerald-500 rounded-full" style={{ width: `${opponent.winRate}%` }}></div>
                                                    </div>
                                                </li>
                                            ))}
                                        </ul>
                                    ) : (
                                        <div className={EMPTY_STATE_CLASS}>이 선수의 경기 기록이 없습니다.</div>
                                    )}
                                </div>
                            </div>
                        ) : null}
                    </div>

                    {/* 상대 전적 검색 */}
                    <div className={APP_CARD_CLASS}>
                        <h2 className="font-extrabold text-gray-800 mb-4 text-lg">⚔️ 상대 전적 비교</h2>
                        <div className="mb-4">
                            <PlayerCardSelector
                                members={members}
                                selectedA={statA}
                                selectedB={statB}
                                activeSlot={activeStatSlot}
                                onActiveSlotChange={setActiveStatSlot}
                                onSelect={selectStatPlayer}
                                labels={{ a: '비교 A', b: '비교 B' }}
                            />
                        </div>

                        {h2hStats && h2hStats.total > 0 ? (
                            <div className="flex justify-between items-center bg-gray-800 text-white p-4 rounded-xl">
                                <div className="text-center w-1/3">
                                    <div className="text-2xl font-black text-blue-400">{h2hStats.aWins}승</div>
                                </div>
                                <div className="text-center w-1/3 text-xs font-medium text-gray-400">총 {h2hStats.total}전</div>
                                <div className="text-center w-1/3">
                                    <div className="text-2xl font-black text-red-400">{h2hStats.bWins}승</div>
                                </div>
                            </div>
                        ) : (statA && statB) ? (
                            <div className={EMPTY_STATE_CLASS}>전적 기록이 없습니다.</div>
                        ) : null}
                    </div>

                    {/* 선택한 상대 전적 상세 기록 */}
                    {statA && statB ? (
                        <div>
                            <h2 className="font-extrabold text-gray-800 mb-1 text-lg px-1">🧾 상대 전적 상세 기록</h2>
                            <p className="text-[11px] font-bold text-gray-400 mb-3 px-1">더 오래된 기록은 아래 ‘더 보기’로 불러올 수 있습니다.</p>
                            {h2hMatches.length > 0 ? (
                                <ul className="space-y-2">
                                    {h2hMatches.map(m => {
                                        const aWon = m.scoreA > m.scoreB;
                                        return (
                                            <li key={m.id} className={`${APP_CARD_TIGHT_CLASS} flex items-center gap-3 text-sm`}>
                                                <span className="shrink-0 text-[11px] font-black text-gray-400">{m.date}</span>
                                                <div className="min-w-0 flex-1 flex items-center justify-between gap-2 font-extrabold text-gray-700">
                                                    <span className={`min-w-0 flex-1 truncate ${aWon ? 'text-blue-600' : 'text-gray-600'}`}>{aWon ? '🏆 ' : ''}{m.playerA_name} <span className="text-[10px] font-black text-gray-400">({getPlayerDivision(m.playerA_id)})</span></span>
                                                    <span className="shrink-0 bg-gray-100 px-2 py-1 rounded-lg font-black text-gray-800">{m.scoreA} : {m.scoreB}</span>
                                                    <span className={`min-w-0 flex-1 truncate text-right ${!aWon ? 'text-red-600' : 'text-gray-600'}`}>{!aWon ? '🏆 ' : ''}{m.playerB_name} <span className="text-[10px] font-black text-gray-400">({getPlayerDivision(m.playerB_id)})</span></span>
                                                </div>
                                            </li>
                                        );
                                    })}
                                </ul>
                            ) : (
                                <div className={EMPTY_STATE_CLASS}>선택한 선수들의 경기 기록이 없습니다.</div>
                            )}
                        </div>
                    ) : null}

                    {/* 전체 기록 리스트 */}
                    <div>
                        <div className="flex items-end justify-between gap-3 mb-3 px-1">
                            <div>
                                <h2 className="font-extrabold text-gray-800 text-lg">📅 최근 경기 기록</h2>
                                <p className="text-[11px] font-bold text-gray-400">최신 경기부터 표시됩니다.</p>
                            </div>
                            <span className="shrink-0 text-xs font-black text-gray-500 bg-gray-100 px-2 py-1 rounded-full">{matches.length}건</span>
                        </div>
                        {matches.length > 0 ? (
                            <ul className="space-y-3">
                                {matches.map(m => {
                                    const aWon = m.scoreA > m.scoreB;
                                    const isEditing = editingMatchId === m.id;
                                    const isSaving = savingMatchId === m.id;
                                    const playerAOptions = getPlayerOptions(m.playerA_id, m.playerA_name);
                                    const playerBOptions = getPlayerOptions(m.playerB_id, m.playerB_name);

                                    return (
                                        <li key={m.id} className={`${APP_CARD_COMPACT_CLASS} flex flex-col gap-3`}>
                                            <div className="flex items-center justify-between gap-2">
                                                <div className="text-[10px] font-bold text-gray-400">{m.date}</div>
                                                <div className="flex gap-2">
                                                    <button
                                                        type="button"
                                                        onClick={() => isEditing ? cancelEditMatch() : startEditMatch(m)}
                                                        disabled={isSaving}
                                                        className={`text-[11px] font-black px-3 py-1 rounded-full btn-press ${isEditing ? 'bg-gray-200 text-gray-700' : 'bg-blue-50 text-blue-700'}`}
                                                    >
                                                        {isEditing ? '취소' : '수정'}
                                                    </button>
                                                    <button
                                                        type="button"
                                                        onClick={() => requestDeleteMatch(m)}
                                                        disabled={isSaving}
                                                        className={`text-[11px] font-black px-3 py-1 rounded-full ${DANGER_BUTTON_CLASS}`}
                                                    >
                                                        삭제
                                                    </button>
                                                </div>
                                            </div>

                                            <div className="flex justify-between items-center">
                                                <div className={`w-1/3 min-w-0 text-center font-extrabold text-base ${aWon ? 'text-blue-600' : 'text-gray-600'}`}>
                                                    <div className="truncate">{aWon ? '🏆 ' : ''}{m.playerA_name}</div>
                                                    <div className="mt-1 truncate text-[10px] font-black text-gray-400">{getPlayerDivision(m.playerA_id)}</div>
                                                </div>
                                                <span className="w-1/3 text-center bg-gray-100 py-1 rounded-lg font-black text-gray-800 text-lg tracking-widest">{m.scoreA} : {m.scoreB}</span>
                                                <div className={`w-1/3 min-w-0 text-center font-extrabold text-base ${!aWon ? 'text-red-600' : 'text-gray-600'}`}>
                                                    <div className="truncate">{!aWon ? '🏆 ' : ''}{m.playerB_name}</div>
                                                    <div className="mt-1 truncate text-[10px] font-black text-gray-400">{getPlayerDivision(m.playerB_id)}</div>
                                                </div>
                                            </div>

                                            {isEditing ? (
                                                <div className="mt-2 bg-gray-50 border border-gray-100 rounded-2xl p-3 space-y-3">
                                                    <input
                                                        type="date"
                                                        value={editDate}
                                                        onChange={e => setEditDate(e.target.value)}
                                                        className="w-full bg-white border border-gray-200 text-center font-bold text-gray-700 p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500"
                                                    />
                                                    <div className="grid grid-cols-[1fr_auto_1fr] gap-2 items-center">
                                                        <select
                                                            value={editPlayerA}
                                                            onChange={e => setEditPlayerA(e.target.value)}
                                                            className="min-w-0 bg-white border border-blue-100 text-blue-800 p-3 rounded-xl font-black outline-none focus:ring-2 focus:ring-blue-500"
                                                        >
                                                            <option value="" disabled>선수 A</option>
                                                            {playerAOptions.map(member => <option key={member.id} value={member.id}>{member.name} {member.division ? `(${member.division})` : ''}</option>)}
                                                        </select>
                                                        <span className="font-black text-gray-300 italic">VS</span>
                                                        <select
                                                            value={editPlayerB}
                                                            onChange={e => setEditPlayerB(e.target.value)}
                                                            className="min-w-0 bg-white border border-red-100 text-red-800 p-3 rounded-xl font-black outline-none focus:ring-2 focus:ring-red-500"
                                                        >
                                                            <option value="" disabled>선수 B</option>
                                                            {playerBOptions.map(member => <option key={member.id} value={member.id}>{member.name} {member.division ? `(${member.division})` : ''}</option>)}
                                                        </select>
                                                    </div>

                                                    <div className="grid grid-cols-3 gap-2">
                                                        {SCORE_OPTIONS.map(option => {
                                                            const selected = editScoreA === option.scoreA && editScoreB === option.scoreB;
                                                            return (
                                                                <button
                                                                    key={`${option.scoreA}-${option.scoreB}`}
                                                                    type="button"
                                                                    onClick={() => { setEditScoreA(option.scoreA); setEditScoreB(option.scoreB); }}
                                                                    className={`py-3 rounded-xl border-2 font-black btn-press ${selected ? 'bg-gray-900 border-gray-900 text-white' : option.scoreA > option.scoreB ? 'bg-white border-blue-100 text-blue-700' : 'bg-white border-red-100 text-red-700'}`}
                                                                >
                                                                    {option.scoreA} : {option.scoreB}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>

                                                    <button
                                                        type="button"
                                                        onClick={() => updateMatch(m)}
                                                        disabled={isSaving || !isAuthReady}
                                                        className={`w-full ${PRIMARY_BUTTON_CLASS}`}
                                                    >
                                                        {isSaving ? '저장 중...' : '수정 저장'}
                                                    </button>
                                                </div>
                                            ) : null}
                                        </li>
                                    );
                                })}
                            </ul>
                        ) : (
                            <div className="text-center text-sm font-bold text-gray-400 py-6 bg-gray-50 rounded-xl">저장된 경기 기록이 없습니다.</div>
                        )}

                        {hasMoreMatches ? (
                            <button
                                type="button"
                                onClick={onLoadMoreMatches}
                                disabled={isLoadingMoreMatches || !isAuthReady}
                                className={`mt-4 w-full ${NEUTRAL_BUTTON_CLASS}`}
                            >
                                {isLoadingMoreMatches ? '불러오는 중...' : `이전 경기 ${MATCH_PAGE_SIZE}건 더 보기`}
                            </button>
                        ) : matches.length > 0 ? (
                            <div className="mt-4 text-center text-[11px] font-bold text-gray-400">불러올 이전 경기 기록이 없습니다.</div>
                        ) : null}
                    </div>
                    </div>
                </>
            );
        }

        // 앱 렌더링
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(error => {
                    console.error('서비스 워커 등록 실패:', error);
                });
            });
        }
    </script>
</body>
</html>
