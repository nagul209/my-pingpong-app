<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>심플 탁구 기록기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        .btn-press:active { transform: scale(0.95); transition: transform 0.1s; }
        /* 모바일 최적화: 스크롤바 숨기기 */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-20">

    <div id="root"></div>

    <script type="text/babel">
        // -------------------------------------------------------------
        // 1. Firebase 초기화 및 연결 (고객님 설정 유지)
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyDjzeueCblNOUmNdETDEOhRAkhQC3Tflw8",
            authDomain: "my-pingpong.firebaseapp.com",
            databaseURL: "https://my-pingpong-default-rtdb.firebaseio.com/",
            projectId: "my-pingpong",
            storageBucket: "my-pingpong.firebasestorage.app",
            messagingSenderId: "512202176301",
            appId: "1:512202176301:web:70abc887e90d130f87c5a4"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // -------------------------------------------------------------
        // 2. React 메인 앱 컴포넌트
        // -------------------------------------------------------------
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('match');
            const [members, setMembers] = useState([]);
            const [matches, setMatches] = useState([]);

            // Firebase 실시간 데이터 구독
            useEffect(() => {
                const membersRef = db.ref('simple_members');
                const matchesRef = db.ref('simple_matches');

                membersRef.on('value', snapshot => {
                    const data = snapshot.val();
                    const formatted = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
                    setMembers(formatted);
                });

                matchesRef.on('value', snapshot => {
                    const data = snapshot.val();
                    const formatted = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
                    // 최신순 정렬
                    setMatches(formatted.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)));
                });

                return () => {
                    membersRef.off();
                    matchesRef.off();
                };
            }, []);

            return (
                <div className="flex flex-col h-screen">
                    <header className="bg-blue-600 text-white p-4 text-center font-black text-lg shadow-sm">
                        🏓 탁구 기록기
                    </header>

                    <main className="flex-1 overflow-y-auto p-4">
                        {activeTab === 'member' && <MemberTab members={members} />}
                        {activeTab === 'match' && <MatchTab members={members} />}
                        {activeTab === 'stats' && <StatsTab members={members} matches={matches} />}
                    </main>

                    {/* 하단 네비게이션 */}
                    <nav className="bg-white border-t flex justify-around p-3 fixed bottom-0 w-full max-w-md text-sm font-bold text-gray-400 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        <button onClick={() => setActiveTab('member')} className={`flex-1 flex flex-col items-center btn-press ${activeTab === 'member' ? 'text-blue-600' : ''}`}>
                            <span className="text-xl mb-1">👥</span>회원
                        </button>
                        <button onClick={() => setActiveTab('match')} className={`flex-1 flex flex-col items-center btn-press ${activeTab === 'match' ? 'text-blue-600' : ''}`}>
                            <span className="text-xl mb-1">⚔️</span>경기
                        </button>
                        <button onClick={() => setActiveTab('stats')} className={`flex-1 flex flex-col items-center btn-press ${activeTab === 'stats' ? 'text-blue-600' : ''}`}>
                            <span className="text-xl mb-1">📊</span>통계
                        </button>
                    </nav>
                </div>
            );
        }

        // -------------------------------------------------------------
        // 3. 회원 관리 탭 컴포넌트
        // -------------------------------------------------------------
        function MemberTab({ members }) {
            const DIVISION_OPTIONS = ['1부', '2부', '3부', '4부', '5부', '6부', '7부'];
            const [name, setName] = useState('');
            const [division, setDivision] = useState('');
            const [isSaving, setIsSaving] = useState(false);

            const addMember = async () => {
                const trimmedName = name.trim();

                if (!trimmedName) return alert("이름을 입력해주세요.");
                if (!division) return alert("부수를 선택해주세요.");

                setIsSaving(true);

                try {
                    await db.ref('simple_members').push({
                        name: trimmedName,
                        division,
                        createdAt: Date.now()
                    });
                    setName('');
                    setDivision('');
                    alert("회원이 추가되었습니다.");
                } catch (error) {
                    console.error('회원 저장 실패:', error);
                    alert(`회원 저장에 실패했습니다.\n${error.message || '잠시 후 다시 시도해주세요.'}`);
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <h2 className="font-extrabold text-gray-800 mb-4 text-lg">➕ 새 회원 등록</h2>
                        <div className="space-y-3">
                            <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="이름" className="w-full bg-gray-50 border-0 p-3 rounded-xl font-bold focus:ring-2 focus:ring-blue-500 outline-none" />
                            <select value={division} onChange={e => setDivision(e.target.value)} className="w-full bg-gray-50 border-0 p-3 rounded-xl font-bold focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="" disabled>부수를 선택하세요</option>
                                {DIVISION_OPTIONS.map(option => <option key={option} value={option}>{option}</option>)}
                            </select>
                            <button onClick={addMember} disabled={isSaving} className={`w-full text-white font-bold p-3 rounded-xl shadow-md btn-press ${isSaving ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-600'}`}>
                                {isSaving ? '저장 중...' : '등록하기'}
                            </button>
                        </div>
                    </div>

                    <div>
                        <h2 className="font-extrabold text-gray-800 mb-3 text-lg px-1">📋 회원 목록 ({members.length}명)</h2>
                        <ul className="space-y-2">
                            {members.map(m => (
                                <li key={m.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                                    <span className="font-bold text-gray-800 text-lg">{m.name}</span>
                                    <span className="text-xs font-medium text-blue-600 bg-blue-50 px-2 py-1 rounded-md">
                                        {m.division || '부수 미입력'}
                                    </span>
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            );
        }

        // -------------------------------------------------------------
        // 4. 경기 기록 탭 컴포넌트 (원터치 최적화)
        // -------------------------------------------------------------
        function MatchTab({ members }) {
            const today = new Date().toISOString().split('T')[0];
            const [date, setDate] = useState(today);
            const [playerA, setPlayerA] = useState('');
            const [playerB, setPlayerB] = useState('');

            const saveMatch = (scoreA, scoreB) => {
                if (!playerA || !playerB) return alert("두 선수를 모두 선택해주세요.");
                if (playerA === playerB) return alert("서로 다른 선수를 선택해주세요.");

                const nameA = members.find(m => m.id === playerA)?.name;
                const nameB = members.find(m => m.id === playerB)?.name;

                db.ref('simple_matches').push({
                    date,
                    playerA_id: playerA, playerA_name: nameA,
                    playerB_id: playerB, playerB_name: nameB,
                    scoreA, scoreB,
                    timestamp: Date.now()
                });

                alert(`${nameA} ${scoreA} : ${scoreB} ${nameB}\n기록이 저장되었습니다!`);
                // 초기화 (다음 경기를 위해 선수는 유지하고 스코어만 리셋하는 개념이므로 알림만 띄움)
            };

            return (
                <div className="flex flex-col gap-5 h-full">
                    {/* 날짜 */}
                    <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-white border border-gray-200 text-center font-bold text-gray-700 p-3 rounded-xl shadow-sm outline-none" />

                    {/* 선수 선택 */}
                    <div className="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <select value={playerA} onChange={e => setPlayerA(e.target.value)} className="flex-1 bg-blue-50 text-blue-800 font-black text-lg p-3 rounded-xl text-center outline-none cursor-pointer text-ellipsis overflow-hidden">
                            <option value="" disabled>선수 A</option>
                            {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                        </select>
                        <span className="font-black text-gray-300 mx-3 italic text-xl">VS</span>
                        <select value={playerB} onChange={e => setPlayerB(e.target.value)} className="flex-1 bg-red-50 text-red-800 font-black text-lg p-3 rounded-xl text-center outline-none cursor-pointer text-ellipsis overflow-hidden">
                            <option value="" disabled>선수 B</option>
                            {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                        </select>
                    </div>

                    {/* 원터치 스코어 보드 */}
                    <div className="mt-4">
                        <p className="text-center text-xs font-bold text-gray-400 mb-3">👇 경기 결과를 터치하면 즉시 저장됩니다</p>
                        <div className="grid grid-cols-2 gap-3">
                            {/* A 승리 버튼들 */}
                            <button onClick={() => saveMatch(3, 0)} className="bg-white border-2 border-blue-100 hover:bg-blue-50 text-blue-700 font-black text-2xl py-6 rounded-2xl shadow-sm btn-press">3 : 0 승리</button>
                            <button onClick={() => saveMatch(0, 3)} className="bg-white border-2 border-red-100 hover:bg-red-50 text-red-700 font-black text-2xl py-6 rounded-2xl shadow-sm btn-press">0 : 3 승리</button>
                            <button onClick={() => saveMatch(3, 1)} className="bg-white border-2 border-blue-100 hover:bg-blue-50 text-blue-700 font-black text-2xl py-6 rounded-2xl shadow-sm btn-press">3 : 1 승리</button>
                            <button onClick={() => saveMatch(1, 3)} className="bg-white border-2 border-red-100 hover:bg-red-50 text-red-700 font-black text-2xl py-6 rounded-2xl shadow-sm btn-press">1 : 3 승리</button>
                            <button onClick={() => saveMatch(3, 2)} className="bg-white border-2 border-blue-100 hover:bg-blue-50 text-blue-700 font-black text-2xl py-6 rounded-2xl shadow-sm btn-press">3 : 2 승리</button>
                            <button onClick={() => saveMatch(2, 3)} className="bg-white border-2 border-red-100 hover:bg-red-50 text-red-700 font-black text-2xl py-6 rounded-2xl shadow-sm btn-press">2 : 3 승리</button>
                        </div>
                    </div>
                </div>
            );
        }

        // -------------------------------------------------------------
        // 5. 통계 탭 컴포넌트
        // -------------------------------------------------------------
        function StatsTab({ members, matches }) {
            const [statA, setStatA] = useState('');
            const [statB, setStatB] = useState('');

            // 상대 전적 계산
            const h2hStats = useMemo(() => {
                if (!statA || !statB) return null;
                let aWins = 0, bWins = 0;
                matches.forEach(m => {
                    if (m.playerA_id === statA && m.playerB_id === statB) {
                        if (m.scoreA > m.scoreB) aWins++; else bWins++;
                    } else if (m.playerA_id === statB && m.playerB_id === statA) {
                        if (m.scoreB > m.scoreA) aWins++; else bWins++;
                    }
                });
                return { aWins, bWins, total: aWins + bWins };
            }, [statA, statB, matches]);

            return (
                <div className="space-y-6">
                    {/* 상대 전적 검색 */}
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <h2 className="font-extrabold text-gray-800 mb-4 text-lg">⚔️ 상대 전적 비교</h2>
                        <div className="flex gap-2 items-center mb-4">
                            <select value={statA} onChange={e => setStatA(e.target.value)} className="flex-1 bg-gray-50 border-0 p-2 rounded-lg font-bold text-sm outline-none">
                                <option value="">선택</option>
                                {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                            </select>
                            <span className="font-black text-gray-300 text-sm">VS</span>
                            <select value={statB} onChange={e => setStatB(e.target.value)} className="flex-1 bg-gray-50 border-0 p-2 rounded-lg font-bold text-sm outline-none">
                                <option value="">선택</option>
                                {members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                            </select>
                        </div>

                        {h2hStats && h2hStats.total > 0 ? (
                            <div className="flex justify-between items-center bg-gray-800 text-white p-4 rounded-xl">
                                <div className="text-center w-1/3">
                                    <div className="text-2xl font-black text-blue-400">{h2hStats.aWins}승</div>
                                </div>
                                <div className="text-center w-1/3 text-xs font-medium text-gray-400">총 {h2hStats.total}전</div>
                                <div className="text-center w-1/3">
                                    <div className="text-2xl font-black text-red-400">{h2hStats.bWins}승</div>
                                </div>
                            </div>
                        ) : (statA && statB) ? (
                            <div className="text-center text-sm font-bold text-gray-400 py-4 bg-gray-50 rounded-xl">전적 기록이 없습니다.</div>
                        ) : null}
                    </div>

                    {/* 전체 기록 리스트 */}
                    <div>
                        <h2 className="font-extrabold text-gray-800 mb-3 text-lg px-1">📅 최근 경기 기록</h2>
                        <ul className="space-y-3">
                            {matches.map(m => {
                                const aWon = m.scoreA > m.scoreB;
                                return (
                                    <li key={m.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-2">
                                        <div className="text-[10px] font-bold text-gray-400">{m.date}</div>
                                        <div className="flex justify-between items-center">
                                            <span className={`w-1/3 text-center font-extrabold text-base ${aWon ? 'text-blue-600' : 'text-gray-600'}`}>{m.playerA_name}</span>
                                            <span className="w-1/3 text-center bg-gray-100 py-1 rounded-lg font-black text-gray-800 text-lg tracking-widest">{m.scoreA} : {m.scoreB}</span>
                                            <span className={`w-1/3 text-center font-extrabold text-base ${!aWon ? 'text-red-600' : 'text-gray-600'}`}>{m.playerB_name}</span>
                                        </div>
                                    </li>
                                )
                            })}
                        </ul>
                    </div>
                </div>
            );
        }

        // 앱 렌더링
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
